# Every prompt of the method, rendered by the engine, compared with its expected text.
# Run: npm run method:check -- <pack folder> review-gate
slug: 1234-order-discount
material: 'Card: show the plan name on the order.

  Criteria: X.'
cases:
- name: specify
  route: feature
  prompt: prompts/specify.md
  expect: expected/specify.txt
- name: specify with the gate adjustments
  route: feature
  prompt: prompts/specify.md
  expect: expected/specify-notes.txt
  state:
    notes: &id001
    - include the business customer case
    - do not change the API
- name: deliver (feature)
  route: feature
  prompt: prompts/deliver-{{route}}.md
  expect: expected/deliver-feature.txt
  state:
    authorization: Commit the specification and deliver the scope 1234-order-discount end to end (plan, implementation of each step and review)
- name: deliver with notes and answers (feature)
  route: feature
  prompt: prompts/deliver-{{route}}.md
  expect: expected/deliver-feature-full.txt
  state:
    authorization: Commit the specification and deliver the scope 1234-order-discount end to end (plan, implementation of each step and review)
    notes: *id001
    answers: &id002
    - use the name field
- name: deliver (screen)
  route: screen
  prompt: prompts/deliver-{{route}}.md
  expect: expected/deliver-screen.txt
  state:
    authorization: Deliver the scope 1234-order-discount end to end (plan, implementation of each step and review)
- name: deliver with notes and answers (screen)
