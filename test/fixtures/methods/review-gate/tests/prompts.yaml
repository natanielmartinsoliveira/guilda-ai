  prompt: prompts/deliver-{{route}}.md
  expect: expected/deliver-fix-full.txt
  state:
    authorization: Deliver the scope 1234-order-discount end to end (plan, implementation of each step and review)
    notes: *id001
    answers: *id002
- name: deliver (adopt)
  route: adopt
  prompt: prompts/deliver-{{route}}.md
  expect: expected/deliver-adopt.txt
  state:
    authorization: Adopt the context 1234-order-discount end to end as requested (survey, specification and adoption)
